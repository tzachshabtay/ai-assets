name: Deploy Android Internal Test

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional Google Play release notes; defaults to the latest commit subject
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-internal-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish internal test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build library packages
        run: npm run build:packages

      - name: Resolve Android version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          version_name="1.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: Verify release secrets
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required repository secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare upload keystore
        shell: bash
        working-directory: demos/space-invaders/android
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p keystores
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > keystores/ci-upload.jks
          chmod 600 keystores/ci-upload.jks

      - name: Build phone assets and sync Capacitor
        run: npm run android:sync --workspace @ai-game-assets/demo-space-invaders

      - name: Build signed Android App Bundle
        working-directory: demos/space-invaders/android
        env:
          ANDROID_KEYSTORE_PATH: keystores/ci-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean bundleRelease --no-daemon

      - name: Prepare release notes
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="$(git log -1 --pretty=%s)"
          fi
          mkdir -p build/google-play/whatsnew
          printf '%s\n' "$RELEASE_NOTES" > build/google-play/whatsnew/whatsnew-en-US

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-invaders-${{ env.ANDROID_VERSION_NAME }}
          path: demos/space-invaders/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aiassets.invaders
          releaseFiles: demos/space-invaders/android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: Internal ${{ env.ANDROID_VERSION_NAME }} (${{ env.ANDROID_VERSION_CODE }})
          whatsNewDirectory: build/google-play/whatsnew
